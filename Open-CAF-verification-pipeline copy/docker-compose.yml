services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opencaf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caf_secure_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-open_caf_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caf_admin} -d ${POSTGRES_DB:-open_caf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opencaf-net

  storage:
    image: minio/minio:latest
    container_name: opencaf-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opencaf-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opencaf-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - PROJECT_NAME=${PROJECT_NAME:-Open CAF}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-caf_admin}:${POSTGRES_PASSWORD:-caf_secure_password_change_in_prod}@db:5432/${POSTGRES_DB:-open_caf_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-caf_admin}:${POSTGRES_PASSWORD:-caf_secure_password_change_in_prod}@db:5432/${POSTGRES_DB:-open_caf_db}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_super_secret_key_at_least_32_chars_long_12345}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_DIR=/app/storage_data
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.3:70b}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opencaf-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opencaf-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Open CAF Local Authority}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - opencaf-net

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  storage_data:
    driver: local

networks:
  opencaf-net:
    driver: bridge
